name: CI

on:
  push:
    branches: [feature/web-ui, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            webui/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r webui/requirements.txt pytest
      - name: Check build content standard
        run: python scripts/check_build_files.py
      - name: Compile backend
        run: python -m compileall -q webui
      - name: Run tests
        run: python -m pytest webui/tests -q
