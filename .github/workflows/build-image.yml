name: Build and Push WebUI Image

on:
  push:
    branches:
      - feature/web-ui
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webui-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push multi-arch image
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKERHUB_PASSWORD }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: misrivers/dlr-webui
          tags: |
            type=raw,value=latest
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./webui/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: false

  verify:
    name: Verify published image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Pull published image
        run: docker pull --platform linux/amd64 misrivers/dlr-webui@${{ needs.build.outputs.digest }}

      - name: Start container
        run: |
          mkdir -p "$RUNNER_TEMP/dlr/config" "$RUNNER_TEMP/dlr/downloads" \
                   "$RUNNER_TEMP/dlr/data" "$RUNNER_TEMP/dlr/logs"
          docker run -d --name dlr-ci --platform linux/amd64 -p 18642:8642 \
            -e DLR_DISABLE_WORKERS=1 \
            -v "$RUNNER_TEMP/dlr/config:/app/config" \
            -v "$RUNNER_TEMP/dlr/downloads:/app/downloads" \
            -v "$RUNNER_TEMP/dlr/data:/app/data" \
            -v "$RUNNER_TEMP/dlr/logs:/app/logs" \
            misrivers/dlr-webui@${{ needs.build.outputs.digest }}

      - name: Health check
        run: |
          for attempt in $(seq 1 30); do
            code=$(curl -s -o health.json -w '%{http_code}' \
              http://127.0.0.1:18642/api/system/health || true)
            if [ "$code" = "200" ]; then
              cat health.json
              exit 0
            fi
            sleep 2
          done
          docker logs dlr-ci
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f dlr-ci || true
